<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARK Streamer Awards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --orange: #ff6a00;
      --cream: #fff1dc;
      --black: #0f0f0a;
      --cream-soft: #fff1dc;
      --ink: var(--black);
      --muted: #4a453c;
      --red: #ef4444;
      --green: #2fbe6a;
      --bg: transparent;
      --border: 4px solid var(--black);
      --shadow: 6px 6px 0 var(--black);
      --shadow-sm: 4px 4px 0 var(--black);
      --radius: 18px;
      --radius-sm: 14px;
      --font: "Fredoka", system-ui, sans-serif;
      --scale: 1;
      --interval: 12s;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 460px;
      height: 240px;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
    }

    body.preview {
      background:
        radial-gradient(900px 480px at 18% 8%, rgba(255, 106, 0, 0.18), transparent 55%),
        radial-gradient(700px 420px at 88% 90%, rgba(110, 182, 228, 0.14), transparent 50%),
        #1a1814;
    }

    .dock {
      position: absolute;
      top: 24px;
      left: 8px;
      z-index: 2;
      transform: scale(var(--scale));
      transform-origin: top left;
    }

    .stack {
      position: relative;
      width: 430px;
      filter: drop-shadow(0 8px 12px rgba(15, 15, 10, 0.16));
      animation:
        dockIn 0.7s cubic-bezier(0.34, 1.4, 0.64, 1),
        floatIdle 5.5s 0.7s ease-in-out infinite;
    }

    .stamp {
      position: absolute;
      top: -12px;
      right: 16px;
      left: auto;
      z-index: 4;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--orange);
      color: #fff;
      border: 3px solid var(--black);
      border-radius: 999px;
      box-shadow: 3px 3px 0 var(--black);
      padding: 5px 12px 6px;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      transform: rotate(-5deg);
      animation: stampPulse 8s 0.8s cubic-bezier(0.34, 1.35, 0.64, 1) infinite;
    }

    .stamp .star {
      width: 9px;
      height: 9px;
      background: #fff;
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    }

    .card {
      background: var(--cream);
      border: var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px 20px 12px 16px;
      overflow: hidden;
    }

    .face {
      display: grid;
      grid-template-columns: 132px minmax(0, 1fr);
      align-items: center;
      column-gap: 20px;
    }

    .face.out {
      animation: faceOut 0.32s cubic-bezier(0.4, 0, 0.2, 1) both;
    }

    .face.in {
      animation: faceIn 0.55s cubic-bezier(0.34, 1.45, 0.64, 1) both;
    }

    .qr-well {
      flex: 0 0 132px;
      width: 132px;
      height: 132px;
      background: #fff;
      border: 3px solid var(--black);
      border-radius: var(--radius-sm);
      padding: 6px;
      display: grid;
      place-items: center;
    }

    .qr-well img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .copy {
      min-width: 0;
      min-height: 132px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 0;
      text-align: left;
    }

    .chip {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      word-spacing: 0.18em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .nominee {
      width: 100%;
      font-size: 44px;
      font-weight: 700;
      line-height: 0.92;
      letter-spacing: -0.045em;
      text-wrap: balance;
    }

    .nominee.short {
      font-size: 62px;
      line-height: 0.88;
      letter-spacing: -0.05em;
    }

    .nominee.long {
      font-size: 26px;
      line-height: 1;
      letter-spacing: -0.03em;
    }

    .nominee .amp {
      color: var(--orange);
      padding: 0 0.08em;
    }

    .timer {
      margin-top: 8px;
      height: 6px;
      border: 2px solid var(--black);
      border-radius: 99px;
      overflow: hidden;
      background: #ffe4b8;
    }

    .timer span {
      display: block;
      height: 100%;
      width: 100%;
      background: var(--orange);
      transform-origin: left center;
      animation: drain var(--interval) linear forwards;
    }

    @keyframes dockIn {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.92);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes floatIdle {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    @keyframes stampPulse {
      0%, 88%, 100% { transform: rotate(-5deg) scale(1); }
      92% { transform: rotate(-6deg) scale(1.12); }
      96% { transform: rotate(-4deg) scale(1.05); }
    }

    @keyframes faceOut {
      to {
        opacity: 0;
        transform: translateX(-12px) scale(0.96);
      }
    }

    @keyframes faceIn {
      from {
        opacity: 0;
        transform: translateX(16px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }

    @keyframes drain {
      from { transform: scaleX(1); }
      to { transform: scaleX(0); }
    }
  </style>
</head>
<body>
  <div class="dock br" id="dock">
    <div class="stack">
      <div class="stamp">
        <span class="star"></span>
        Scan to vote
        <span class="star"></span>
      </div>
      <article class="card">
        <div class="face in" id="face">
          <div class="qr-well">
            <img id="qr" src="qr/breakout.png" alt="Vote QR code" />
          </div>
          <div class="copy">
            <span class="chip" id="chip">Breakout Streamer</span>
            <h2 class="nominee" id="nominee">Arky</h2>
          </div>
        </div>
        <div class="timer"><span id="timer"></span></div>
      </article>
    </div>
  </div>

  <script>
    const AWARDS = [
      {
        id: "breakout",
        category: "Breakout Streamer",
        nominee: "Arky",
        short: true,
        qr: "qr/breakout.png",
      },
      {
        id: "reality",
        category: "Reality Streamer",
        nominee: "Arky",
        short: true,
        qr: "qr/reality.png",
      },
      {
        id: "content",
        category: "Content Group",
        nominee: "OSCS",
        short: true,
        qr: "qr/content-group.png",
      },
      {
        id: "duo",
        category: "Stream Duo",
        nominee: "Arky <span class=\"amp\">&amp;</span> Bonnie",
        qr: "qr/duo.png",
      },
      {
        id: "marathon",
        category: "Marathon Stream",
        nominee: "Iceland Motorcycle Marathon",
        long: true,
        qr: "qr/marathon.png",
      },
    ];

    const params = new URLSearchParams(location.search);
    const interval = Math.max(4, Number(params.get("interval")) || 12);
    const scale = Math.max(0.5, Math.min(2, Number(params.get("scale")) || 1));
    const only = params.get("only");
    const start = params.get("start");

    const list = only
      ? AWARDS.filter((item) => item.id === only)
      : AWARDS;

    const awards = list.length ? list : AWARDS;
    let index = Math.max(0, awards.findIndex((item) => item.id === start));
    if (index < 0) index = 0;

    const dock = document.getElementById("dock");
    const face = document.getElementById("face");
    const chip = document.getElementById("chip");
    const nominee = document.getElementById("nominee");
    const qr = document.getElementById("qr");
    let cycleTimer = null;
    let busy = false;

    document.documentElement.style.setProperty("--interval", interval + "s");
    document.documentElement.style.setProperty("--scale", String(scale));
    if (params.has("preview")) document.body.classList.add("preview");

    awards.forEach((item) => {
      const img = new Image();
      img.src = item.qr;
    });

    function paint(i) {
      const item = awards[i];
      chip.textContent = item.category;
      nominee.innerHTML = item.nominee;
      nominee.classList.toggle("short", Boolean(item.short));
      nominee.classList.toggle("long", Boolean(item.long));
      qr.src = item.qr;
      qr.alt = "Vote for " + item.nominee.replace(/<[^>]+>/g, "");
    }

    function restartTimer() {
      const bar = document.querySelector(".timer span");
      const next = bar.cloneNode(true);
      bar.replaceWith(next);
    }

    function show(i, animate) {
      const apply = () => {
        paint(i);
        restartTimer();
        if (animate) {
          face.classList.remove("out");
          face.classList.add("in");
        }
        busy = false;
      };

      if (!animate) {
        apply();
        return;
      }

      busy = true;
      face.classList.remove("in");
      face.classList.add("out");
      window.setTimeout(apply, 280);
    }

    function step(delta) {
      if (busy) return;
      index = (index + delta + awards.length) % awards.length;
      show(index, true);
      armCycle();
    }

    function armCycle() {
      window.clearInterval(cycleTimer);
      if (awards.length < 2) return;
      cycleTimer = window.setInterval(() => step(1), interval * 1000);
    }

    paint(index);
    armCycle();

    window.addEventListener("keydown", (event) => {
      if (event.key === "ArrowRight") step(1);
      if (event.key === "ArrowLeft") step(-1);
    });

    document.querySelector(".card").addEventListener("click", () => step(1));
  </script>
</body>
</html>
